services:
  app:
    build: .
    ports:
      - "5173:8000"
    volumes:
      - app-db:/app/db
    environment:
      - DB_PATH=/app/db/data.db
      - APP_BASE_URL=${APP_BASE_URL:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - MODEL_DICT_PREPROCESS=${MODEL_DICT_PREPROCESS:-}
      - MODEL_QUICK_ANSWER=${MODEL_QUICK_ANSWER:-}
      - MODEL_DEEP_THINK=${MODEL_DEEP_THINK:-}
      - QUOTA_USER_DAILY=${QUOTA_USER_DAILY:-}
      - QUOTA_GUEST_DAILY=${QUOTA_GUEST_DAILY:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITEE_CLIENT_ID=${GITEE_CLIENT_ID:-}
      - GITEE_CLIENT_SECRET=${GITEE_CLIENT_SECRET:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - ADMIN_USERS=${ADMIN_USERS:-}
      - ZDIC_TIMEOUT=${ZDIC_TIMEOUT:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  app-db: