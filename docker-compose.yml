services:
  app:
    build: .
    ports:
      - "5173:8000"
    volumes:
      - app-db:/app/db
    environment:
      - DB_PATH=/app/db/data.db
      - APP_BASE_URL=http://localhost:5173
      - LLM_BASE_URL=https://openrouter.ai/api/v1
      - LLM_API_KEY=${LLM_API_KEY:-}
      - MODEL_DICT_PREPROCESS=xiaomi/mimo-v2.5
      - MODEL_QUICK_ANSWER=xiaomi/mimo-v2.5
      - MODEL_DEEP_THINK=xiaomi/mimo-v2.5
      - QUOTA_USER_DAILY=50
      - QUOTA_GUEST_DAILY=50
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITEE_CLIENT_ID=${GITEE_CLIENT_ID:-}
      - GITEE_CLIENT_SECRET=${GITEE_CLIENT_SECRET:-}
      - JWT_SECRET=${JWT_SECRET:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  app-db: