version: '3.8'

services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    ports:
      - "4122:4122"
    restart: always
    depends_on:
      - pocketbase
    environment:
      - APP_ENV=production
      - POCKETBASE_URL=http://pocketbase:8090

  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile.pocketbase
    container_name: pocketbase
    ports:
      - "8090:8090"
    volumes:
      - pocketbase_data:/db/pb_data
    restart: always
